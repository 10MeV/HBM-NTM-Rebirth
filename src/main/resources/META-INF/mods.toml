modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
displayURL="https://github.com/10MeV/HBM-NTM-Rebirth"
issueTrackerURL="https://github.com/10MeV/HBM-NTM-Rebirth/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
mandatory=false
versionRange="[15.20.0,)"
ordering="AFTER"
side="BOTH"

# The performance stack is intentionally optional. HBM's unified OBJ backend
# preserves the source-backed CPU fallback, while these mods accelerate the
# normal Forge client/runtime without becoming a server or packaging requirement.
[[dependencies."${mod_id}"]]
modId="embeddium"
mandatory=false
versionRange="[0.3.31,)"
ordering="NONE"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="oculus"
mandatory=false
versionRange="[1.8.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="modernfix"
mandatory=false
versionRange="[5.27.63,)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="ferritecore"
mandatory=false
versionRange="[6.0.1,)"
ordering="NONE"
side="BOTH"
