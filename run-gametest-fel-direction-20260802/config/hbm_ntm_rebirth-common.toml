		scaleRtgPower = false

[network]

	[network.packetThreading]
		#Legacy 0.01_enablePacketThreading key: prepare selected high-frequency S2C packets and defer their ordered sends to server tick end. Modern Forge channel sends remain on the server thread; no packet worker is created.
		enablePacketThreading = true
		#Legacy compatibility key retained for existing configs and diagnostics. The modern main-thread deferred bridge has no worker timeout fallback.
		packetThreadingErrorBypass = false
		#Legacy compatibility value retained for existing configs and commands. The modern bridge never waits on packet-worker futures.
		#Range: 1 ~ 1000
		packetThreadingWaitTimeoutMs = 50
		#Maximum pending deferred packet operations before the ordered queue is drained early on the server thread; queued packets are not discarded.
		#Range: 1 ~ 65536
		packetThreadingMaxPending = 4096
		#Legacy compatibility value retained for existing configs and commands. Normal modern dispatch is already server-thread owned.
		#Range: 1 ~ 1000
		packetThreadingFallbackClearThreshold = 5

[radiation]
	#Legacy FOG_00_threshold: chunk radiation in RADs required for radiation fog.
	#Range: > 0
	fogRad = 100
	#Legacy FOG_01_threshold: 1:n chance for fog while the radiation system updates.
	#Range: > 1
	fogChance = 20
	#Legacy AMBIENT_00_nether: RAD/s applied in the Nether.
	#Range: 0.0 ~ 1.7976931348623157E308
	hellRad = 0.1
	#Legacy RADWORLD_00_toggle: allow high radiation to modify terrain.
	worldRadEffects = true
	#Legacy RADWORLD_01_amount: block operation batches per tick.
	#Range: > 0
	worldRad = 10
	#Legacy RADWORLD_02_minimum: minimum chunk radiation for terrain mutation.
	#Range: > 0
	worldRadThreshold = 20
	#Legacy RADWORLD_03_regrow: whether dead grass and mycelium should decay into dirt.
	cleanupDeadDirt = false
	#Legacy general 1.01_enableMyceliumSpread: allows glowing waste mycelium to spread.
	enableMyceliumSpread = false
	#Legacy WorldConfig 17.B_toggle radiation side: nuclear fallout marks crater zones that apply ambient radiation.
	enableCraterBiomeRadiation = true
	#Legacy WorldConfig 17.R00_craterBiomeRad: RAD/s for the crater zone.
	#Range: 0.0 ~ 1.7976931348623157E308
	craterBiomeRad = 5.0
	#Legacy WorldConfig 17.R01_craterBiomeInnerRad: RAD/s for the inner crater zone.
	#Range: 0.0 ~ 1.7976931348623157E308
	craterBiomeInnerRad = 25.0
	#Legacy WorldConfig 17.R02_craterBiomeOuterRad: RAD/s for the outer crater zone.
	#Range: 0.0 ~ 1.7976931348623157E308
	craterBiomeOuterRad = 0.5
	#Legacy WorldConfig 17.R03_craterBiomeWaterMult: multiplier while wet in crater zones.
	#Range: 0.0 ~ 1.7976931348623157E308
	craterBiomeWaterMult = 5.0
	#Legacy RADIATION_00_enableContamination: toggles entity radiation contamination.
	enableContamination = true
	#Legacy RADIATION_01_enableChunkRads: toggles chunk radiation.
	enableChunkRads = true
	#Legacy RADIATION_99_enablePRISM: enables the 3D resistance-aware PRISM chunk radiation handler instead of the default Simple handler.
