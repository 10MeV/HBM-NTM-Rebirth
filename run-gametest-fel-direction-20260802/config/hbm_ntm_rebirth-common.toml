
[migration]
	#Log scaffold startup information during common setup.
	logStartup = true
	#Keep explicit legacy ID notes enabled while porting from 1.7.10.
	enableLegacyIdNotes = true

[general]
	#Legacy GeneralConfig 1.18_enableExtendedLogging: logs detonators, nuclear explosions, missile launches, grenades, and related high-impact actions.
	enableExtendedLogging = false
	#Legacy GeneralConfig 1.21_enableVirus: allows crystal_virus blocks to spread into adjacent solid blocks and then harden.
	enableCrystalVirusSpreading = false
	#Legacy GeneralConfig 1.36_enableMOTD: shows the HBM loaded-world chat message when a player joins.
	enableMotd = true
	#Legacy GeneralConfig 1.44_enableMachineGravity: large machines require a proper foundation and tilt when unsupported. The old 528-only companion switch is intentionally not migrated.
	enableMachineGravity = false
	#Legacy GeneralConfig enableCataclysm: every server-side living death spawns a Burning FOEQ at y=500.
	enableCataclysm = false

