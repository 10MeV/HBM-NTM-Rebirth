plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

// Concurrent developer runs otherwise share build/classes and can make javac
// observe class files being removed by another Gradle invocation.  Launchers
// may opt into an isolated, ignored output directory with -PhbmBuildDir=... .
if (project.hasProperty('hbmBuildDir')) {
    layout.buildDirectory.set(project.file(project.property('hbmBuildDir')))
}

// `runClient` loads mod classes directly from the selected build directory for
// the entire lifetime of the Minecraft process.  A second Gradle invocation
// using build-client (most notably clean/compileJava) can otherwise empty that
// directory after the game has started, causing a delayed
// NoClassDefFoundError when Minecraft first reaches an unloaded class.
def usesIsolatedClientBuild = layout.buildDirectory.get().asFile.canonicalFile ==
        layout.projectDirectory.dir('build-client').asFile.canonicalFile
def isolatedClientBuildLockChannel = null
def isolatedClientBuildLock = null
if (usesIsolatedClientBuild) {
    def lockFile = layout.projectDirectory.file('.hbm-client-output.lock').asFile
    lockFile.parentFile.mkdirs()
    try {
        isolatedClientBuildLockChannel = java.nio.channels.FileChannel.open(lockFile.toPath(),
                java.nio.file.StandardOpenOption.CREATE, java.nio.file.StandardOpenOption.WRITE)
        isolatedClientBuildLock = isolatedClientBuildLockChannel.tryLock()
    } catch (java.nio.channels.OverlappingFileLockException | java.io.IOException ignored) {
        // Another process or Gradle instance owns the same client output.
    }
    if (isolatedClientBuildLock == null) {
        isolatedClientBuildLockChannel?.close()
        throw new GradleException('build-client is in use by an active HBM client or isolated client build. '
                + 'Close it before running another Gradle command with -PhbmBuildDir=build-client.')
    }
    gradle.buildFinished {
        try {
            isolatedClientBuildLock?.release()
        } finally {
            isolatedClientBuildLockChannel?.close()
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Forge 1.20.1 discovers mod classes through a Java 17-era scanner. Keep the
// Java 21 toolchain for the updated LWJGL runtime, but publish Java 17 bytecode.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    def gameTestNamespaces = "${mod_id},minecraft"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Keep interactive development on run/, while allowing automated
            // client resource verification to avoid a user's active world and log.
            if (project.hasProperty('clientRunDir')) {
                workingDirectory project.file(project.property('clientRunDir'))
            }
            // Automated visual gates need a real player/server before their event
            // handlers can initialize.  Keep quick play explicit so ordinary
            // interactive runs still stop at the title screen, while audits can
            // enter a known save without DPI-sensitive mouse automation.
            if (project.hasProperty('clientQuickPlayWorld')) {
                args '--quickPlaySingleplayer', project.property('clientQuickPlayWorld').toString()
            }
            property 'forge.enabledGameTestNamespaces', gameTestNamespaces
            if (project.hasProperty('guiAuditManifest')) {
                property 'hbm_ntm.guiAuditManifest', project.property('guiAuditManifest').toString()
            }
            if (project.hasProperty('guiAuditOutput')) {
                property 'hbm_ntm.guiAuditOutput', project.property('guiAuditOutput').toString()
            }
            if (project.hasProperty('guiAuditAutoExit')) {
                property 'hbm_ntm.guiAuditAutoExit', project.property('guiAuditAutoExit').toString()
            }
            if (project.hasProperty('multiblockPlacementAuditManifest')) {
                property 'hbm_ntm.multiblockPlacementAuditManifest', project.property('multiblockPlacementAuditManifest').toString()
            }
            if (project.hasProperty('multiblockPlacementAuditOutput')) {
                property 'hbm_ntm.multiblockPlacementAuditOutput', project.property('multiblockPlacementAuditOutput').toString()
            }
            if (project.hasProperty('multiblockPlacementAuditAutoExit')) {
                property 'hbm_ntm.multiblockPlacementAuditAutoExit', project.property('multiblockPlacementAuditAutoExit').toString()
            }
            if (project.hasProperty('multiblockPlacementAuditSettleTicks')) {
                property 'hbm_ntm.multiblockPlacementAuditSettleTicks', project.property('multiblockPlacementAuditSettleTicks').toString()
            }
            if (project.hasProperty('worldModelAuditManifest')) {
                property 'hbm_ntm.worldModelAuditManifest', project.property('worldModelAuditManifest').toString()
            }
            if (project.hasProperty('worldModelAuditOutput')) {
                property 'hbm_ntm.worldModelAuditOutput', project.property('worldModelAuditOutput').toString()
            }
            if (project.hasProperty('worldModelAuditAutoExit')) {
                property 'hbm_ntm.worldModelAuditAutoExit', project.property('worldModelAuditAutoExit').toString()
            }
            if (project.hasProperty('nonBlockGuiAuditManifest')) {
                property 'hbm_ntm.nonBlockGuiAuditManifest', project.property('nonBlockGuiAuditManifest').toString()
            }
            if (project.hasProperty('nonBlockGuiAuditOutput')) {
                property 'hbm_ntm.nonBlockGuiAuditOutput', project.property('nonBlockGuiAuditOutput').toString()
            }
            if (project.hasProperty('nonBlockGuiAuditAutoExit')) {
                property 'hbm_ntm.nonBlockGuiAuditAutoExit', project.property('nonBlockGuiAuditAutoExit').toString()
            }
            if (project.hasProperty('fusionItemAuditOutput')) {
                property 'hbm_ntm.fusionItemAuditOutput', project.property('fusionItemAuditOutput').toString()
            }
            if (project.hasProperty('fusionItemAuditAutoExit')) {
                property 'hbm_ntm.fusionItemAuditAutoExit', project.property('fusionItemAuditAutoExit').toString()
            }
            if (project.hasProperty('fusionItemAuditDiagnosticCarrier')) {
                property 'hbm_ntm.fusionItemAuditDiagnosticCarrier', project.property('fusionItemAuditDiagnosticCarrier').toString()
            }
            if (project.hasProperty('fluidTankItemAuditOutput')) {
                property 'hbm_ntm.fluidTankItemAuditOutput', project.property('fluidTankItemAuditOutput').toString()
            }
            if (project.hasProperty('fluidTankItemAuditAutoExit')) {
                property 'hbm_ntm.fluidTankItemAuditAutoExit', project.property('fluidTankItemAuditAutoExit').toString()
            }
            if (project.hasProperty('ironFurnaceItemAuditOutput')) {
                property 'hbm_ntm.ironFurnaceItemAuditOutput', project.property('ironFurnaceItemAuditOutput').toString()
            }
            if (project.hasProperty('ironFurnaceItemAuditAutoExit')) {
                property 'hbm_ntm.ironFurnaceItemAuditAutoExit', project.property('ironFurnaceItemAuditAutoExit').toString()
            }
        }

        server {
            // Keep dedicated-server verification isolated from an interactive client.
            if (project.hasProperty('serverRunDir')) {
                workingDirectory project.file(project.property('serverRunDir'))
            }
            property 'forge.enabledGameTestNamespaces', gameTestNamespaces
            args '--nogui'
        }

        gameTestServer {
            // A shared `run` directory can be held by an active client/server.  Keep
            // the normal directory as the default, but let isolated verification use
            // `-PgameTestRunDir=<project-relative-directory>` without perturbing it.
            if (project.hasProperty('gameTestRunDir')) {
                workingDirectory project.file(project.property('gameTestRunDir'))
            }
            property 'forge.enabledGameTestNamespaces', gameTestNamespaces
            // Forge 1.20.1 has no command-line batch selector.  Keep this
            // opt-in switch limited to the dedicated GameTest run so the
            // missile regression suite can be executed without unrelated
            // batches aborting the server before it reaches those tests.
            if (project.hasProperty('missileGameTestOnly')) {
                property 'hbm_ntm.gametest.missileOnly', 'true'
            }
            if (project.hasProperty('materialGameTestOnly')) {
                property 'hbm_ntm.gametest.materialOnly', 'true'
            }
            if (project.hasProperty('surfacePlantsGameTestOnly')) {
                property 'hbm_ntm.gametest.surfacePlantsOnly', 'true'
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.blamejared.com' }
    // Performance mods remain external to the published HBM jar. Modrinth's
    // Maven endpoint supplies the exact Forge 1.20.1 artifacts to dev runs.
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

// LWJGL 3.3.4+ embeds GLFW 3.4+, which fixes disabled-cursor input in Windows RDP
// sessions. Minecraft 1.20.1 is compiled against the old stb_image_resize API,
// which was removed in LWJGL 3.3.6, so STB must remain on Minecraft's 3.3.1
// Java/native pair. The remaining modules may use the newer GLFW-compatible set.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl' && details.requested.name != 'lwjgl-stb') {
            details.useVersion lwjgl_version
            details.because 'Use GLFW 3.4 RDP input handling while preserving Minecraft MouseHandler behavior'
        }
    }
}

configurations {
    // External Forge optimization mods are production/modpack artifacts. They
    // cannot run against the Parchment-named userdev classpath without their
    // own remapped development builds, so keep their version lock resolvable
    // but outside normal compile, client, server, and GameTest classpaths.
    performanceMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Production-style client profile for the optional Embeddium + Oculus
    // render-compatibility matrix. These release artifacts must stay out of
    // the Parchment-named Forge userdev classpath.
    renderCompatibilityMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Optional production/modpack optimization stack. HBM has no hard API
    // linkage, so these must not pollute the Parchment-named userdev runtime.
    performanceMods "maven.modrinth:embeddium:${embeddium_version}"
    performanceMods "maven.modrinth:oculus:${oculus_version}"
    performanceMods "maven.modrinth:modernfix:${modernfix_version}"
    performanceMods "maven.modrinth:ferrite-core:${ferritecore_version}"

    renderCompatibilityMods "maven.modrinth:embeddium:${embeddium_version}"
    renderCompatibilityMods "maven.modrinth:oculus:${oculus_version}"
}

tasks.register('resolvePerformanceMods') {
    group = 'verification'
    description = 'Resolves the pinned optional Forge optimization mod artifacts.'
    doLast {
        configurations.performanceMods.files.each { file -> logger.lifecycle("Resolved optional performance mod: ${file.name}") }
    }
}

// ForgeGradle writes the named development jar to build/libs before reobfJar
// replaces it with the production-mapped jar.  Keep a separate, atomically
// published release artifact so launchers cannot pick up that transient jar
// while a build is still running.
def publishedReleaseJar = layout.buildDirectory.file("release/${mod_id}-${mod_version}.jar")
def publishReleaseJar = tasks.register('publishReleaseJar') {
    group = 'build'
    description = 'Publishes the production-mapped HBM jar after reobfuscation completes.'
    dependsOn tasks.named('reobfJar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    outputs.file(publishedReleaseJar)

    doLast {
        def source = tasks.named('jar').get().archiveFile.get().asFile.toPath()
        def target = publishedReleaseJar.get().asFile.toPath()
        java.nio.file.Files.createDirectories(target.parent)
        def staged = target.resolveSibling(target.fileName.toString() + '.tmp')
        java.nio.file.Files.copy(source, staged, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        try {
            java.nio.file.Files.move(staged, target,
                    java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
            java.nio.file.Files.move(staged, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('build').configure {
    dependsOn publishReleaseJar
}

tasks.register('prepareEmbeddiumOculusProfile', Sync) {
    group = 'verification'
    description = 'Builds HBM and prepares an isolated optional Forge client mod profile with Embeddium and Oculus.'
    dependsOn publishReleaseJar
    from(configurations.renderCompatibilityMods)
    from(publishedReleaseJar)
    into(layout.projectDirectory.dir('run-embeddium-oculus/mods'))
}

tasks.register('prepareEmbeddiumOculusDevRun', Sync) {
    group = 'verification'
    description = 'Prepares Embeddium and Oculus only for the isolated ForgeGradle development client run.'
    from(configurations.renderCompatibilityMods)
    into(layout.projectDirectory.dir('run-embeddium-oculus-dev/mods'))
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// Keep the complete project and upstream notices inside every distributable
// mod jar.  The source directory remains easy to audit, while the generated
// HBM subdirectories carry verbatim copies of the applicable GNU license
// texts for recipients who only receive the binary jar.
tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
        rename { "${mod_id}-LICENSE" }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { "${mod_id}-NOTICE.md" }
    }
    from('third_party_licenses') {
        into 'META-INF/third_party_licenses'
    }
    from('LICENSE') {
        into 'META-INF/third_party_licenses/hbm-original'
        rename { 'LICENSE' }
    }
    from('LICENSE.LESSER') {
        into 'META-INF/third_party_licenses/hbm-original'
        rename { 'LICENSE.LESSER' }
    }
    from('LICENSE') {
        into 'META-INF/third_party_licenses/hbm-modernized'
        rename { 'LICENSE' }
    }
}

def requireStableJavaSourceSnapshot = providers.gradleProperty('guiAuditRequireStableSourceSnapshot')
        .map { it.toBoolean() }.orElse(false)
def mainJavaSourceSnapshotSha256 = {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    def entries = []
    sourceSets.main.java.srcDirs.findAll { it.isDirectory() }.sort { it.canonicalPath }.each { sourceRoot ->
        fileTree(sourceRoot) { include '**/*.java' }.files.each { sourceFile ->
            entries << [root: sourceRoot.canonicalFile, file: sourceFile.canonicalFile]
        }
    }
    entries.sort { left, right ->
        def leftPath = left.root.toPath().relativize(left.file.toPath()).toString().replace('\\', '/')
        def rightPath = right.root.toPath().relativize(right.file.toPath()).toString().replace('\\', '/')
        (left.root.canonicalPath + '/' + leftPath) <=> (right.root.canonicalPath + '/' + rightPath)
    }.each { entry ->
        def relative = entry.root.toPath().relativize(entry.file.toPath()).toString().replace('\\', '/')
        digest.update(entry.root.canonicalPath.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        digest.update((byte) 0)
        digest.update(relative.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        digest.update((byte) 0)
        digest.update(java.nio.file.Files.readAllBytes(entry.file.toPath()))
        digest.update((byte) 0)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}
def stableJavaSourceSnapshotFile = layout.buildDirectory.file('audit/main-java-source-snapshot.sha256')

tasks.named('compileJava').configure {
    doFirst {
        if (requireStableJavaSourceSnapshot.get()) {
            project.ext.hbmMainJavaSourceSnapshotBeforeCompile = mainJavaSourceSnapshotSha256()
        }
    }
    doLast {
        if (requireStableJavaSourceSnapshot.get()) {
            def before = project.ext.hbmMainJavaSourceSnapshotBeforeCompile
            def after = mainJavaSourceSnapshotSha256()
            if (before != after) {
                throw new GradleException('Main Java sources changed while compileJava was running; '
                        + 'refusing a mixed source/class audit build.')
            }
            def snapshotFile = stableJavaSourceSnapshotFile.get().asFile
            snapshotFile.parentFile.mkdirs()
            snapshotFile.setText(after + System.lineSeparator(), 'UTF-8')
        }
    }
}

def verifyStableJavaSourceSnapshot = { String phase ->
    if (!requireStableJavaSourceSnapshot.get()) {
        return
    }
    def snapshotFile = stableJavaSourceSnapshotFile.get().asFile
    if (!snapshotFile.isFile()) {
        throw new GradleException("Stable Java source snapshot is missing before ${phase}: ${snapshotFile}")
    }
    def compiledSnapshot = snapshotFile.getText('UTF-8').trim()
    def currentSnapshot = mainJavaSourceSnapshotSha256()
    if (compiledSnapshot != currentSnapshot) {
        throw new GradleException("Main Java sources changed after compileJava and before ${phase}; "
                + 'refusing to launch Minecraft with stale or missing classes.')
    }
}

// Gradle normally notices a missing output directory, but an interrupted or
// externally-cleared directory can still leave an incremental run with a
// mixed classpath.  Verify every conventional top-level Java output before a
// Forge run starts so a missing lazy-loaded machine/network class cannot turn
// into an in-game server crash.
def verifyRuntimeClasspath = tasks.register('verifyRuntimeClasspath') {
    group = 'verification'
    description = 'Verifies that every compiled main Java source is present on the runtime classpath.'
    dependsOn tasks.named('classes')

    doLast {
        def classDirectories = sourceSets.main.output.classesDirs.files.findAll { it.isDirectory() }
        def missing = []
        sourceSets.main.java.srcDirs.findAll { it.isDirectory() }.each { sourceRoot ->
            fileTree(sourceRoot) { include '**/*.java' }.files.each { sourceFile ->
                if (sourceFile.name == 'package-info.java' || sourceFile.name == 'module-info.java') {
                    return
                }
                def simpleName = sourceFile.name[0..-6]
                def declaration = java.util.regex.Pattern.compile(
                        '(?m)(?:\\b(?:class|interface|enum|record)\\s+|@interface\\s+)'
                                + java.util.regex.Pattern.quote(simpleName) + '\\b')
                if (!declaration.matcher(sourceFile.getText('UTF-8')).find()) {
                    return
                }
                def packageMatcher = java.util.regex.Pattern.compile(
                        '(?m)^\\s*package\\s+([A-Za-z_$][\\w$]*(?:\\.[A-Za-z_$][\\w$]*)*)\\s*;')
                        .matcher(sourceFile.getText('UTF-8'))
                def relativeClass = packageMatcher.find()
                        ? packageMatcher.group(1).replace('.', '/') + '/' + simpleName + '.class'
                        : simpleName + '.class'
                if (!classDirectories.any { new File(it, relativeClass).isFile() }) {
                    missing << relativeClass
                }
            }
        }
        if (classDirectories.isEmpty() || missing) {
            def summary = missing.take(12).join(', ')
            def suffix = missing.size() > 12 ? " (and ${missing.size() - 12} more)" : ''
            throw new GradleException('Runtime classpath is incomplete. Missing compiled classes: '
                    + (summary ?: '<no class output directory>') + suffix
                    + '. Rebuild the selected build directory before starting Minecraft.')
        }
        def modsToml = sourceSets.main.output.resourcesDir.toPath().resolve('META-INF/mods.toml').toFile()
        if (!modsToml.isFile()) {
            throw new GradleException('Runtime resources are incomplete: META-INF/mods.toml is missing. '
                    + 'Rebuild the selected build directory before starting Minecraft.')
        }
        verifyStableJavaSourceSnapshot('verifyRuntimeClasspath completion')
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('run') && task.name != 'runEnergyMk2SelfTest') {
        task.dependsOn(verifyRuntimeClasspath)
        task.doFirst {
            verifyStableJavaSourceSnapshot("${task.path} launch")
        }
    }
}

tasks.register('runEnergyMk2SelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs pure Energy MK2 regression checks without starting a Forge server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hbm.ntm.gametest.EnergyMk2GameTests'
}

tasks.register('copyGameTestStructures', Copy) {
    from file('src/gametest/resources/gameteststructures')
    // Keep test templates beside the actual GameTest server world.  Isolated
    // verification selects this directory with -PgameTestRunDir, while the
    // normal run continues to use run/.
    def gameTestRunDirectory = project.hasProperty('gameTestRunDir')
            ? project.file(project.property('gameTestRunDir'))
            : project.file('run')
    into new File(gameTestRunDirectory, 'gameteststructures')
}

tasks.matching { it.name == 'prepareRunGameTestServer' || it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('copyGameTestStructures')
}
