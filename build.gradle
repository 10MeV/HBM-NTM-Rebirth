plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Forge 1.20.1 discovers mod classes through a Java 17-era scanner. Keep the
// Java 21 toolchain for the updated LWJGL runtime, but publish Java 17 bytecode.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    def gameTestNamespaces = "${mod_id},minecraft"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Keep interactive development on run/, while allowing automated
            // client resource verification to avoid a user's active world and log.
            if (project.hasProperty('clientRunDir')) {
                workingDirectory project.file(project.property('clientRunDir'))
            }
            property 'forge.enabledGameTestNamespaces', gameTestNamespaces
        }

        server {
            property 'forge.enabledGameTestNamespaces', gameTestNamespaces
            args '--nogui'
        }

        gameTestServer {
            // A shared `run` directory can be held by an active client/server.  Keep
            // the normal directory as the default, but let isolated verification use
            // `-PgameTestRunDir=<project-relative-directory>` without perturbing it.
            if (project.hasProperty('gameTestRunDir')) {
                workingDirectory project.file(project.property('gameTestRunDir'))
            }
            property 'forge.enabledGameTestNamespaces', gameTestNamespaces
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.blamejared.com' }
    // Performance mods remain external to the published HBM jar. Modrinth's
    // Maven endpoint supplies the exact Forge 1.20.1 artifacts to dev runs.
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

// LWJGL 3.3.4+ embeds GLFW 3.4+, which fixes disabled-cursor input in Windows RDP
// sessions. Keep every LWJGL module aligned to avoid mixing Java/native ABIs.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion lwjgl_version
            details.because 'Use GLFW 3.4 RDP input handling while preserving Minecraft MouseHandler behavior'
        }
    }
}

configurations {
    // External Forge optimization mods are production/modpack artifacts. They
    // cannot run against the Parchment-named userdev classpath without their
    // own remapped development builds, so keep their version lock resolvable
    // but outside normal compile, client, server, and GameTest classpaths.
    performanceMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Optional production/modpack optimization stack. HBM has no hard API
    // linkage, so these must not pollute the Parchment-named userdev runtime.
    performanceMods "maven.modrinth:embeddium:${embeddium_version}"
    performanceMods "maven.modrinth:modernfix:${modernfix_version}"
    performanceMods "maven.modrinth:ferrite-core:${ferritecore_version}"
}

tasks.register('resolvePerformanceMods') {
    group = 'verification'
    description = 'Resolves the pinned optional Forge optimization mod artifacts.'
    doLast {
        configurations.performanceMods.files.each { file -> logger.lifecycle("Resolved optional performance mod: ${file.name}") }
    }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.register('runEnergyMk2SelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs pure Energy MK2 regression checks without starting a Forge server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.hbm.ntm.gametest.EnergyMk2GameTests'
}

tasks.register('copyGameTestStructures', Copy) {
    from file('src/gametest/resources/gameteststructures')
    // Keep test templates beside the actual GameTest server world.  Isolated
    // verification selects this directory with -PgameTestRunDir, while the
    // normal run continues to use run/.
    def gameTestRunDirectory = project.hasProperty('gameTestRunDir')
            ? project.file(project.property('gameTestRunDir'))
            : project.file('run')
    into new File(gameTestRunDirectory, 'gameteststructures')
}

tasks.matching { it.name == 'prepareRunGameTestServer' || it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('copyGameTestStructures')
}
